name: Auto Sync Upstream

on:
  schedule:
    # 每天 08:00 UTC（北京时间 16:00）
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream (only when upstream has new commits)
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const { data: fork } = await github.rest.repos.get({ owner: repo.owner, repo: repo.repo });
            const parent = fork.parent;
            if (!parent) {
              console.log('No upstream parent, skip.');
              return;
            }
            const upstream = `${parent.owner.login}/${parent.name}`;
            const branch = parent.default_branch;
            const runGit = require('child_process').execSync;
            const opt = { stdio: 'inherit' };

            runGit('git config user.name "github-actions[bot]"', opt);
            runGit('git config user.email "41898282+github-actions[bot]@users.noreply.github.com"', opt);

            runGit(`git remote add upstream https://github.com/${upstream}.git`, opt);
            runGit(`git fetch upstream ${branch}`, opt);
            const behind = runGit(`git rev-list --count HEAD..upstream/${branch}`).toString().trim();
            if (behind === '0') {
              console.log(`Upstream ${upstream} has no new commits, skip sync. No changes pushed.`);
              return;
            }
            console.log(`Behind upstream by ${behind} commits, syncing...`);
            runGit(`git merge upstream/${branch} --no-edit`, opt);
            runGit(`git push origin HEAD:${branch}`, opt);
            console.log(`Synced ${behind} new commits from ${upstream}.`);
